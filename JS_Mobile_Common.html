  function getTranslationLang() {
    var c = currentLang || "ko";
    if (c === "mm") return "my";
    if (c === "la") return "lo";
    return c;
  }
  function changeLanguage() {
    var sel = document.getElementById("langSelect");
    if (!sel) return;
    currentLang = sel.value || "ko";
    try { sessionStorage.setItem("cm_lang", currentLang); } catch (e) {}
    applyTranslations();
  }
  function applyTranslations() {
    var lang = (typeof I18N !== "undefined" && I18N[currentLang]) ? I18N[currentLang] : (I18N.ko || {});
    var root = document.body || document.documentElement;
    if (!root) return;
    var list = root.querySelectorAll ? root.querySelectorAll("[data-i18n]") : [];
    for (var i = 0; i < list.length; i++) {
      var el = list[i];
      var key = el.getAttribute("data-i18n");
      if (!key) continue;
      var text = lang[key];
      if (text === undefined) text = (I18N.ko && I18N.ko[key]) ? I18N.ko[key] : "";
      if (el.tagName === "INPUT" || el.tagName === "TEXTAREA") {
        if (key.indexOf("_ph") >= 0 || el.placeholder !== undefined) el.placeholder = text;
        else if (el.type === "submit" || el.type === "button") el.value = text;
      } else {
        el.textContent = text;
      }
    }
    var s = document.getElementById("storeSelect");
    if (s && s.options.length && s.options[0]) s.options[0].text = (lang.m_select_store != null ? lang.m_select_store : "Select Store...");
    var n = document.getElementById("loginName");
    if (n && n.options.length && n.options[0]) n.options[0].text = (lang.m_select_name != null ? lang.m_select_name : "Select Name...");
    var pwTitle = document.getElementById("mobile-pw-title");
    if (pwTitle) pwTitle.textContent = lang.pw_change_title || "🔐 비밀번호 변경";
    var pwOld = document.getElementById("mobile-pw-old"); var pwNew = document.getElementById("mobile-pw-new"); var pwNew2 = document.getElementById("mobile-pw-new2");
    if (pwOld) pwOld.placeholder = lang.pw_current || "현재 비밀번호";
    if (pwNew) pwNew.placeholder = lang.pw_new || "새 비밀번호";
    if (pwNew2) pwNew2.placeholder = lang.pw_new_confirm || "새 비밀번호 확인";
    var pwBtn = document.getElementById("mobile-pw-btn");
    if (pwBtn) pwBtn.textContent = lang.pw_btn_change || "변경";
    var phList = root.querySelectorAll ? root.querySelectorAll("[data-i18n-ph]") : [];
    for (var p = 0; p < phList.length; p++) {
      var phEl = phList[p], phKey = phEl.getAttribute("data-i18n-ph");
      if (phKey && phEl.placeholder !== undefined) phEl.placeholder = (lang[phKey] != null ? lang[phKey] : (I18N.ko && I18N.ko[phKey] ? I18N.ko[phKey] : ""));
    }
  }

  /**
   * 2. 실시간 시계 (1초마다 업데이트)
   */
  setInterval(function() { 
    var clock = document.getElementById("live-clock");
    if(clock) clock.innerText = new Date().toLocaleTimeString('en-GB'); 
  }, 1000);

  /**
   * 3. [핵심] 페이지 로드 시 초기화 로직
   */
  window.onload = function() {
    // [다국어] 로그인 화면 언어 복원 및 적용 (저장된 언어로 드롭다운 맞춤 후 번역 적용)
    var langSel = document.getElementById("langSelect");
    if (langSel) {
      if (currentLang) langSel.value = currentLang;
      else currentLang = langSel.value || "ko";
    }
    applyTranslations();

    // [날짜 초기화] 모든 데이트 입력칸을 오늘로 세팅
    var today = new Date();
    var todayStr = today.toISOString().substring(0, 10);
    var dateIds = ['use-start', 'use-end', 'hist-start', 'hist-end', 'noticeStart', 'noticeEnd', 'schedule-today-date', 'admin-leave-start', 'admin-leave-end', 'admin-att-start', 'admin-att-end', 'mobile-petty-start', 'mobile-petty-end', 'mobile-petty-add-date'];
    dateIds.forEach(id => { if(document.getElementById(id)) document.getElementById(id).value = todayStr; });
    
    var tmr = new Date(today); tmr.setDate(tmr.getDate() + 1);
    if(document.getElementById('leaveDate')) document.getElementById('leaveDate').value = tmr.toISOString().substring(0, 10);

    // [기초 공지 로드] 홈 화면 상단 알림
    if (typeof runApi === 'function') {
      runApi('GET', 'getNotice', {}).then(function(txt) { var content = typeof txt === 'string' ? txt : (txt && (txt.notice != null) ? txt.notice : (txt && txt.text ? txt.text : '')); if(content && document.getElementById("home-notice-content")) document.getElementById("home-notice-content").innerText = content; }).catch(function() {});
    } else {
      google.script.run.withSuccessHandler(txt => { 
        if(txt && document.getElementById("home-notice-content")) document.getElementById("home-notice-content").innerText = txt; 
      }).getNotice();
    }

    // [데이터 통합 로드] 매장, 직원 목록을 가져온 후 UI를 구성
    load(1);
    if (typeof runApi === 'function') {
      runApi('GET', 'getLoginData', {}).then(function(d) {
        load(0);
        loginData = (d && d.users) ? d.users : d;
        fillStoreSelect("storeSelect");
        fillStoreSelect("visit-store-select");
        if(loggedInUser) checkActiveVisitStatus();
      }).catch(function(err) { load(0); alert("Server Error: " + (err && err.message ? err.message : String(err))); });
    } else {
      google.script.run.withSuccessHandler(d => { 
        load(0);
        loginData = d.users; // { "매장명": ["직원1", "직원2"], ... }
        
        fillStoreSelect("storeSelect");        // 로그인 화면 드롭다운
        fillStoreSelect("visit-store-select"); // 방문 기록 화면 드롭다운

        // 이미 로그인 상태일 때 방문 기록 확인
        if(loggedInUser) checkActiveVisitStatus();

      }).withFailureHandler(err => { alert("Server Error: " + err); }).getLoginData();
    } 

    if(loggedInStore && typeof loadTodayVisitLog === 'function') loadTodayVisitLog();
  };

  /**
   * 4. 로그인 및 드롭다운 연동 로직
   */
  // 매장 드롭다운 채우기
  function fillStoreSelect(id) {
    var s = document.getElementById(id);
    if(!s || !loginData) return;
    var txt = (I18N[currentLang] || I18N.ko).m_select_store || "Select Store...";
    s.innerHTML = "<option value=''>" + txt + "</option>";
    var officeKey = loginData["Office"] ? "Office" : (loginData["본사"] ? "본사" : (loginData["CM Office"] ? "CM Office" : null));
    var isVisitSelect = (id === "visit-store-select");
    var loggedStore = (typeof loggedInStore !== "undefined" && loggedInStore) ? String(loggedInStore).trim() : "";
    var isOfficeUser = !!loggedStore && (loggedStore === "CM Office" || loggedStore === "Office" || loggedStore === "본사" || loggedStore.toLowerCase().indexOf("office") !== -1);
    if (officeKey) s.add(new Option(officeKey === "CM Office" ? "CM Office" : "Office (본사)", officeKey));
    for (var k in loginData) { if (k !== officeKey) s.add(new Option(k, k)); }
    if (isVisitSelect && isOfficeUser && !loginData["CM Office"]) {
      var opt = new Option("CM Office", "CM Office");
      try { s.insertBefore(opt, s.options[1]); } catch(e) { s.add(opt); }
    }

function tryLogin() {
  var s = document.getElementById("storeSelect").value;
  var n = document.getElementById("loginName").value;
  var p = document.getElementById("loginPw").value;
  var lang = (typeof I18N !== "undefined" && I18N[currentLang]) ? I18N[currentLang] : {};

  var btn = document.getElementById("btn-login");
  if (btn) btn.innerText = "Processing...";

  function onLoginResult(res) {
    if (btn) btn.innerText = "Login";
    if (res && res.success) {
      loggedInStore = res.storeName; 
      loggedInUser = res.userName; 
      loggedInRole = res.role;
      document.getElementById("login-screen").style.display = "none"; 
      document.getElementById("app-screen").style.display = "block";
      if (document.getElementById("hr-username")) document.getElementById("hr-username").innerText = loggedInUser;

      if (visitTab) {
        if (loggedInStore === "Office" || loggedInStore === "본사" || loggedInStore === "CM Office") visitTab.classList.remove("hidden");
        else visitTab.classList.add("hidden");
      }
      var role = (loggedInRole || "").toLowerCase();
      var adminRoles = ['manager', 'ceo', 'hr', 'director', 'officer'];
      if (adminRoles.some(function(r) { return role.indexOf(r) !== -1; }) && document.getElementById("tab-admin")) document.getElementById("tab-admin").classList.remove("hidden");
      if (adminRoles.some(function(r) { return role.indexOf(r) !== -1; }) && document.getElementById("tab-petty-cash")) document.getElementById("tab-petty-cash").classList.remove("hidden");
      loadData();
      checkActiveVisitStatus();
      if (typeof fillScheduleStoreSelect === 'function') fillScheduleStoreSelect();
      if (typeof fillScheduleMyMonthSelect === 'function') fillScheduleMyMonthSelect();
      var langSel = document.getElementById("langSelect");
      if (langSel && langSel.value) currentLang = langSel.value;
      try { if (typeof sessionStorage !== "undefined") sessionStorage.setItem("cm_lang", currentLang); } catch (e) {}
      setTimeout(function() { applyTranslations(); }, 150);
    } else {
      alert(lang.m_login_fail || "Login Failed: Check PIN.");
    }
  }
  function onLoginFail(err) {
    if (btn) btn.innerText = "Login";
    alert("Server Error: " + (err && err.message ? err.message : String(err)));
  }

  if (typeof runApi === 'function') {
    runApi('POST', 'loginCheck', { store: s, name: n, pw: p, isAdminPage: false }).then(onLoginResult).catch(onLoginFail);
  } else {
    google.script.run.withSuccessHandler(onLoginResult).withFailureHandler(onLoginFail).loginCheck(s, n, p, false);
  }
}

  function loadNotices() {

  function renderNotices() {
    var box = document.getElementById("notice-list-box");
    if(!box) return; box.innerHTML = "";
    var lang = I18N[currentLang] || I18N.ko;
    var s = document.getElementById("noticeStart").value, e = document.getElementById("noticeEnd").value;
    var statusFilter = (document.getElementById("noticeStatusFilter") && document.getElementById("noticeStatusFilter").value) ? document.getElementById("noticeStatusFilter").value : "All";
    var filtered = myNotices.filter(function(n){
      if (statusFilter === "Unread") {
        if (n.status !== "New" && n.status !== "new") return false;
        return true;
      }
      if (statusFilter === "Read") { if (n.status === "New" || n.status === "new") return false; }
      return (!s || n.date >= s) && (!e || n.date <= e);
    });
    if (statusFilter === "Unread") filtered.sort(function(a, b){ return (b.date || "").localeCompare(a.date || ""); });
    if (filtered.length === 0) { box.innerHTML = "<div class='text-center py-4 text-muted'>" + (lang.m_no_notices || "공지사항이 없습니다.") + "</div>"; return; }
    var texts = filtered.map(function(n){ return n.title || ""; });
    var targetLang = typeof getTranslationLang === "function" ? getTranslationLang() : "ko";
    if (targetLang === "ko" || texts.every(function(t){ return !t || !String(t).trim(); }) || typeof runApi === 'function') {
      filtered.forEach(function(n){ appendNoticeItem(box, n, n.title); });
      return;
    }
    google.script.run.withSuccessHandler(function(translated) {
      filtered.forEach(function(n, i){ appendNoticeItem(box, n, (translated && translated[i] !== undefined) ? translated[i] : n.title); });
    }).translateBatch(texts, targetLang);
  }

  function appendNoticeItem(box, n, titleText) {
    var lang = (typeof I18N !== "undefined" && I18N[currentLang]) ? I18N[currentLang] : (I18N.ko || {});
    var isNew = (n.status === "New" || n.status === "new");
    var badge = isNew ? "<span style='background:#dc3545;color:white;font-size:10px;padding:2px 6px;border-radius:4px;margin-right:6px;'>NEW</span>" : "";
    var esc = function(s) { if (s == null || s === "") return ""; return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); };
    var item = document.createElement("div");
    item.style.cssText = "border-bottom:1px solid #eee; padding:12px 0; cursor:pointer; background:white;";
    item.innerHTML = "<div style=\"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;\"><span style=\"font-weight:bold;\">" + badge + esc(titleText || "") + "</span><span style=\"color:#6c757d;font-size:12px;\">" + esc(n.date) + "</span></div><div style=\"font-size:12px;color:#6c757d;\">From: " + esc(n.sender || "") + "</div>";
    item.onclick = function() { openNoticeModal(n); };
    box.appendChild(item);
  }

  function openNoticeModal(n) {
    document.getElementById("modalNoticeId").value = n.id;
    document.getElementById("modalDate").innerText = n.date + " (From: " + n.sender + ")";
    renderNoticeAttachments(n);
    var targetLang = typeof getTranslationLang === "function" ? getTranslationLang() : "ko";
    if (targetLang === "ko" || (!n.title && !n.content) || typeof runApi === 'function') {
      document.getElementById("modalTitle").innerText = n.title || "";
      document.getElementById("modalContent").innerText = n.content || "";
      document.getElementById("noticeModal").style.display = "flex";
      return;
    }
    var texts = [n.title || "", n.content || ""];
    google.script.run.withSuccessHandler(function(translated) {
      document.getElementById("modalTitle").innerText = translated[0] !== undefined ? translated[0] : n.title;
      document.getElementById("modalContent").innerText = translated[1] !== undefined ? translated[1] : n.content;
      document.getElementById("noticeModal").style.display = "flex";
    }).translateBatch(texts, targetLang);
  }

  function renderNoticeAttachments(n) {
    var el = document.getElementById("modalAttachments");
    if (!el) return;
    el.innerHTML = "";
    if (!n.attachments || n.attachments.length === 0) return;
    var lang = I18N[currentLang] || I18N.ko;
    var label = (lang.notice_attach || "📎 첨부파일").replace(/📎\s*/, "");
    var wrap = document.createElement("div");
    wrap.style.borderTop = "1px solid #eee";
    wrap.style.paddingTop = "10px";
    wrap.style.marginTop = "10px";
    var title = document.createElement("div");
    title.style.fontWeight = "bold";
    title.style.marginBottom = "8px";
    title.textContent = "📎 " + label;
    wrap.appendChild(title);
    n.attachments.forEach(function(a) {
      if (a.error) return;
      var isImg = (a.mime || "").indexOf("image/") === 0;
      if (isImg) {
        var img = document.createElement("img");
        img.src = a.url || ("https://drive.google.com/uc?export=view&id=" + (a.id || ""));
        img.alt = a.name || "";
        img.style.maxWidth = "100%";
        img.style.maxHeight = "180px";
        img.style.objectFit = "contain";
        img.style.borderRadius = "8px";
        img.style.marginBottom = "8px";
        wrap.appendChild(img);
      } else {
        var link = document.createElement("a");
        link.href = a.url || ("https://drive.google.com/uc?export=download&id=" + (a.id || ""));
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = a.name || "파일";
        link.style.display = "block";
        link.style.marginBottom = "6px";
        link.style.color = "#E65100";
        wrap.appendChild(link);
      }
    });
    el.appendChild(wrap);
  }
