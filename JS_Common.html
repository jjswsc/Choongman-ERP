  function changeLanguage() {
    var sel = document.getElementById('langSelect');
    if (!sel) return;
    currentLang = sel.value || 'ko';
    try { sessionStorage.setItem('cm_lang', currentLang); } catch (e) {}
    applyTranslations();
    // 관리자 업무일지 탭이 보일 때 테이블/버튼 문구도 언어에 맞게 다시 그리기
    var mgrView = document.getElementById('wl-view-manager');
    if (mgrView && mgrView.style.display !== 'none' && typeof globalManagerData !== 'undefined' && globalManagerData && globalManagerData.length > 0 && typeof renderManagerTable === 'function') {
      renderManagerTable();
    }
  }
  function applyTranslations() {
    var lang = I18N[currentLang] || I18N.ko;
    var placeholderKeys = { placeholder_search: 1, placeholder_pin: 1, placeholder_comment: 1, item_search_ph: 1, order_item_filter_ph: 1, complaint_ph_customer: 1, complaint_ph_contact: 1, complaint_ph_menu: 1, complaint_ph_title: 1, complaint_ph_content: 1, complaint_ph_action: 1, complaint_ph_photo: 1 };
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
      var key = el.getAttribute('data-i18n');
      var text = lang[key] || I18N.ko[key];
      if (text === undefined) return;
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
        if (key.indexOf('placeholder') >= 0 || placeholderKeys[key] || el.getAttribute('data-i18n-placeholder') === '1') el.placeholder = text;
        else if (el.type === 'submit' || el.type === 'button') el.value = text;
      } else {
        el.textContent = text;
      }
    });
    document.querySelectorAll('[data-i18n-title]').forEach(function(el) {
      var key = el.getAttribute('data-i18n-title');
      var text = key ? (lang[key] || I18N.ko[key]) : undefined;
      if (text !== undefined) el.title = text;
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
      var key = el.getAttribute('data-i18n-placeholder');
      var text = key ? (lang[key] || I18N.ko[key]) : undefined;
      if (text !== undefined && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) el.placeholder = text;
    });
    document.querySelectorAll('[data-i18n-alt]').forEach(function(el) {
      var key = el.getAttribute('data-i18n-alt');
      var text = key ? (lang[key] || I18N.ko[key]) : undefined;
      if (text !== undefined && 'alt' in el) el.alt = text;
    });
    var attTodayStore = document.getElementById('att-today-store');
    if (attTodayStore && attTodayStore.options.length > 0 && lang.att_all_stores) attTodayStore.options[0].text = lang.att_all_stores;
  }

  /** 사용자 입력 글 자동 번역용: UI 언어(ko,en,th,mm,la) → LanguageApp 코드(ko,en,th,my,lo) */
  function getTranslationLang() {
    var c = (typeof currentLang !== "undefined" ? currentLang : "ko") || "ko";
    if (c === "mm") return "my";
    if (c === "la") return "lo";
    return c;
  }

  /* ===== 인쇄/PDF / 엑셀 공통 ===== */
  /** 표준 인쇄: 현재 화면(.print-container)만 A4로 출력. 사이드바·버튼 등은 @media print에서 .no-print로 숨김 */
  function doPrint() {
    window.print();
  }
  /** 현재 페이지만 보이게 하고 인쇄 (body.print-show-active + 해당 page에 .print-show 적용) */
  function printCurrentPage() {
    var id = currentPrintPageId || "";
    var el = id ? document.getElementById(id) : null;
    if (!el) {
      var pages = document.querySelectorAll('div[id^="page-"]');
      for (var p = 0; p < pages.length; p++) { if (pages[p].style.display === "block") { el = pages[p]; break; } }
    }
    if (!el) { alert("인쇄할 페이지가 없습니다."); return; }
    el.classList.add("print-show");
    document.body.classList.add("print-show-active");
    window.onafterprint = function() {
      el.classList.remove("print-show");
      document.body.classList.remove("print-show-active");
      window.onafterprint = null;
    };
    window.print();
  }
  /** 주문 승인·출고 등 인보이스 발행용 인쇄 (체크된 행만 인쇄 가능, 인보이스 제목 표시) */
  function printInvoice(pageId) {
    /* 입고 내역 인쇄: 출고 관리와 동일하게 invoice-print-area + body 이동 + invoice-printing 적용 */
    if (pageId === "inbound") {
      var area = document.getElementById("invoice-print-area");
      if (!area) { alert("인보이스 인쇄 영역을 찾을 수 없습니다."); return; }
      var src = document.getElementById("in-tab-hist");
      if (!src) { alert("입고 내역 영역을 찾을 수 없습니다."); return; }
      var clone = src.cloneNode(true);
      clone.id = "in-tab-hist-print";
      area.innerHTML = "";
      area.appendChild(clone);
      area.classList.remove("d-none");
      if (typeof moveInvoicePrintAreaToBody === "function") area = moveInvoicePrintAreaToBody() || area;
      document.body.classList.add("invoice-printing");
      window.onafterprint = function() {
        document.body.classList.remove("invoice-printing");
        area.classList.add("d-none");
        area.innerHTML = "";
        if (typeof restoreInvoicePrintArea === "function") restoreInvoicePrintArea(area);
        window.onafterprint = null;
      };
      window.print();
      return;
    }
    var id = "page-" + (pageId || "").replace(/^page-/, "");
    var el = document.getElementById(id);
    if (!el) { alert("인쇄할 페이지를 찾을 수 없습니다."); return; }
    currentPrintPageId = id;
    var hiddenRows = [];
    if (pageId === "outbound") {
      var list = el.querySelector("#order-list");
      if (list) {
        list.querySelectorAll("tr.ord-data-row").forEach(function(tr) {
          var chk = tr.querySelector(".ord-invoice-chk");
          if (chk && !chk.checked) { tr.classList.add("ord-no-print"); hiddenRows.push(tr); }
        });
        list.querySelectorAll("tr.ord-detail-row").forEach(function(tr) {
          var prev = tr.previousElementSibling;
          if (prev && prev.classList.contains("ord-data-row") && prev.classList.contains("ord-no-print"))
            tr.classList.add("ord-no-print");
        });
      }
    }
    if (pageId === "force") {
      var fhList = el.querySelector("#fh-list");
      if (fhList) {
        fhList.querySelectorAll("tr.fh-data-row").forEach(function(tr) {
          var chk = tr.querySelector(".fh-invoice-chk");
          if (chk && !chk.checked) {
            tr.classList.add("ord-no-print");
            var next = tr.nextElementSibling;
            if (next && next.classList.contains("fh-detail-row")) next.classList.add("ord-no-print");
          }
        });
      }
    }
    el.classList.add("print-show");
    window.onafterprint = function() {
      el.classList.remove("print-show");
      document.querySelectorAll(".ord-no-print").forEach(function(tr) { tr.classList.remove("ord-no-print"); });
      window.onafterprint = null;
    };
    window.print();
  }
  function exportCurrentPageToExcel() {

      var tb = tables[t].querySelector('tbody');

    if (thead) rows = Array.prototype.slice.call(thead.querySelectorAll('tr'));
    var tbody = table.querySelector('tbody');

    if (rows.length === 0) rows = Array.prototype.slice.call(table.querySelectorAll('tr'));
    var csv = [];
    var maxCols = 0;
    for (var i = 0; i < rows.length; i++) {
      var cells = rows[i].querySelectorAll('th, td');
      var row = [];
      for (var j = 0; j < cells.length; j++) {
        var cell = cells[j];
        var text = String(cell.innerText || cell.textContent || "").trim().replace(/"/g, '""');
        var colspan = parseInt(cell.getAttribute('colspan'), 10) || 1;
        row.push('"' + text + '"');
        for (var k = 1; k < colspan; k++) row.push('""');
      }
      if (row.length > maxCols) maxCols = row.length;
      csv.push(row);
    }
    for (var i = 0; i < csv.length; i++) {
      while (csv[i].length < maxCols) csv[i].push('""');
      csv[i] = csv[i].join(',');
    }
    if (maxBodyRows === 0) { alert("조회된 데이터가 없습니다. 먼저 조회 버튼으로 데이터를 불러온 뒤 엑셀 다운로드해 주세요."); return; }
    var blob = new Blob(['\ufeff' + csv.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (id || 'export') + '_' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  }

      targets.forEach(function(tid) {
          var el = document.getElementById(tid);
          if(el) {
              el.innerHTML = "";
              if(!isManager && tid !== "emp-store" && tid !== "a-store") el.add(new Option(allStoresText, "All"));
              if(officeKey && canSeeOffice) el.add(new Option("Office (본사)", officeKey));
              storeFilter.forEach(function(k) {
                  if(k !== officeKey || canSeeOffice) el.add(new Option(k, k));
              });
              if(isManager && typeof userStore !== "undefined" && userStore && tid !== "filter-store-select") { el.value = userStore; el.disabled = true; }
          }
      });

      // 매입처 리스트 로딩 (입고 등록용)
      if(typeof loadVendorDropdowns === 'function') loadVendorDropdowns();
  }
 /* 대시보드 요약 숫자 로드 */
function loadDashboardSummary() {
    var cards = document.getElementById("dash-summary-cards");
    if (!cards) return;
    var pendingEl = document.getElementById("dash-pending-orders");
    var inEl = document.getElementById("dash-inbound");
    var outEl = document.getElementById("dash-outbound");
    var leaveEl = document.getElementById("dash-leave-pending");
    var attEl = document.getElementById("dash-att-pending");
    if (pendingEl) pendingEl.textContent = "-";
    if (inEl) inEl.textContent = "-";
    if (outEl) outEl.textContent = "-";
    if (leaveEl) leaveEl.textContent = "-";
    if (attEl) attEl.textContent = "-";
    google.script.run.withSuccessHandler(function(res) {
        if (!res) return;
        if (pendingEl) pendingEl.textContent = res.pendingOrders != null ? res.pendingOrders : 0;
        if (inEl) inEl.textContent = res.inboundCount != null ? res.inboundCount : 0;
        if (outEl) outEl.textContent = res.outboundCount != null ? res.outboundCount : 0;
        if (leaveEl) leaveEl.textContent = res.leavePending != null ? res.leavePending : 0;
        if (attEl) attEl.textContent = res.attendancePending != null ? res.attendancePending : 0;
    }).withFailureHandler(function() {
        if (pendingEl) pendingEl.textContent = "0";
        if (inEl) inEl.textContent = "0";
        if (outEl) outEl.textContent = "0";
        if (leaveEl) leaveEl.textContent = "0";
        if (attEl) attEl.textContent = "0";
    }).getDashboardSummary(typeof userStore !== "undefined" ? userStore : "", typeof userRole !== "undefined" ? userRole : "");
}

 /* [최종 통합] go 함수: 모든 메뉴의 초기화 및 연동 로직 포함 */
function go(page, el) {
    // 설정 화면은 Director만 접근 가능
    if (page === 'settings' && (!userRole || String(userRole).toLowerCase() !== 'director')) {
        page = 'dashboard';
        el = document.getElementById('menu-dashboard');
    }
    // 1. 모든 페이지 숨김
    document.querySelectorAll('div[id^="page-"]').forEach(d => d.style.display = 'none');

    // 2. 선택한 페이지 표시 (안전장치 포함)
    var target = document.getElementById('page-' + page);
    if (target) {
        target.style.display = 'block';
        currentPrintPageId = 'page-' + page;
        try { sessionStorage.setItem("cm_last_page", page); } catch (e) {}
    } else {
        console.error("페이지를 찾을 수 없습니다: " + page);
        currentPrintPageId = '';
    }

    // 3. 사이드바 버튼 활성화 상태 업데이트 (el 없으면 해당 페이지 링크 찾기)
    if (!el && page) {
        document.querySelectorAll('.sidebar a').forEach(function(a) {
            var on = a.getAttribute('onclick') || '';
            if (on.indexOf("'" + page + "'") !== -1 || on.indexOf('"' + page + '"') !== -1) { el = a; }
        });
    }
    if (el) {
        document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
        el.classList.add('active');
    }

    // 📱 모바일 환경에서 메뉴 선택 시 사이드바 닫기
    if (window.innerWidth <= 768) {
        var sidebar = document.getElementById("sidebar");
        var overlay = document.querySelector(".overlay");
        if (sidebar) sidebar.classList.remove("open");
        if (overlay) overlay.classList.remove("show");
    }

    // ---------------------------------------------------------
    // 4. 각 페이지별 데이터 로드 및 초기화 로직 (누락 방지)
    // ---------------------------------------------------------

    // [대시보드] 진입 시 요약 숫자 + 받은 공지 로드
    if (page === 'dashboard') {
        loadDashboardSummary();
        var nrStart = document.getElementById("notice-received-start");
        var nrEnd = document.getElementById("notice-received-end");
        if (nrStart && !nrStart.value) {
            var d = new Date();
            nrStart.value = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-01";
            nrEnd.value = d.toISOString().substring(0, 10);
        }
        if (typeof loadNoticeReceived === "function") loadNoticeReceived();
    }

    // [근태 관리] 진입 시
    if (page === 'attendance-manage') {
        // 1. 매장 선택 드롭다운 ID를 'sch-store-select'로 정확히 타겟팅하여 강제 로드
        var attFilter = document.getElementById('att-store-filter');
        var schSelect = document.getElementById('sch-store-select'); // ID 수정됨
        
        if (attFilter) attFilter.classList.remove('loaded');
        if (schSelect) schSelect.classList.remove('loaded');

        loadStoreOptions('att-store-filter'); 
        loadStoreOptions('sch-store-select'); // 스마트 스케줄러용 매장 목록 로드

        // ★ [추가] 조회 및 수정 탭의 매장 리스트도 강제로 불러옵니다.
         const viewSelect = document.getElementById('view-store-select');
    
        if (viewSelect) {
        viewSelect.classList.remove('loaded'); // 기존 로딩 기록 초기화
        loadStoreOptions('view-store-select'); // 매장 목록 로드 함수 호출
    }

    showAttendanceTab('status'); // 기본 탭 설정

        // 2. 탭 초기화 (기본적으로 첫 번째 '근태 현황' 탭 표시)
        showAttendanceTab('status'); 

        // 3. 날짜 자동 세팅: 기간 조회 기준 오늘로 통일 (시작일·종료일 모두 오늘)
        var now = new Date();
        var today = now.toISOString().substring(0, 10);
        if (document.getElementById('att-start')) document.getElementById('att-start').value = today;
        if (document.getElementById('att-end')) document.getElementById('att-end').value = today;
        
        // 스마트 스케줄러 기준 날짜(해당 주 월요일) 세팅
        if (document.getElementById('sch-week-monday')) {
            var monday = (typeof getMondayOfWeek === 'function') ? getMondayOfWeek(today) : today;
            document.getElementById('sch-week-monday').value = monday;
            if (typeof initWeeklyGrid === 'function') initWeeklyGrid();
        }
    }
    // [업무 일지] 진입 시 - 관리자 승인 조회기간 초기값 오늘로
    if (page === 'work-log') {
        var today = new Date().toISOString().substring(0, 10);
        var mgrStart = document.getElementById("mgr-date-start");
        var mgrEnd = document.getElementById("mgr-date-end");
        if (mgrStart) mgrStart.value = today;
        if (mgrEnd) mgrEnd.value = today;
        if (typeof showWorkLogTab === 'function') {
            showWorkLogTab('personal');
        } else {
            var wlView = document.getElementById("wl-view-personal");
            if (wlView) wlView.style.display = "block";
            if (typeof initWorkLog === 'function') initWorkLog();
        }
    }

    // [설정] 진입 시 본사 정보 폼 로드 + 설정 탭 + 번역 적용 (매장 목록은 '메뉴별 권한' 탭에서 로드)
    if (page === 'settings') {
        if (typeof applyTranslations === 'function') applyTranslations();
        if (typeof loadHeadOfficeInfo === 'function') loadHeadOfficeInfo();
        if (typeof showSettingsTab === 'function') showSettingsTab('office');
    }

    // [패티 캐쉬] 진입 시 - 탭(내역), 매장 목록, 날짜 기본값
    if (page === 'petty-cash') {
        if (typeof showPettyCashTab === 'function') showPettyCashTab('list');
        var pcStore = document.getElementById('petty-cash-store');
        var pcAddStore = document.getElementById('petty-add-store');
        if (pcStore) pcStore.classList.remove('loaded');
        if (pcAddStore) pcAddStore.classList.remove('loaded');
        loadStoreOptions('petty-cash-store');
        loadStoreOptions('petty-add-store');
        var today = new Date().toISOString().substring(0, 10);
        var pcStart = document.getElementById('petty-cash-start');
        var pcEnd = document.getElementById('petty-cash-end');
        var pcAddDate = document.getElementById('petty-add-date');
        if (pcStart && !pcStart.value) pcStart.value = today;
        if (pcEnd && !pcEnd.value) pcEnd.value = today;
        if (pcAddDate && !pcAddDate.value) pcAddDate.value = today;
        if (typeof loadPettyCashList === 'function') loadPettyCashList();
    }

    // [매장 점검] 진입 시
    if (page === 'store-manage') {
        if (typeof showStoreTab === 'function') showStoreTab('check');
        
        var chkStore = document.getElementById('chk-store');
        var histStore = document.getElementById('hist-store');
        if (chkStore) chkStore.classList.remove('loaded');
        if (histStore) histStore.classList.remove('loaded');

        loadStoreOptions('chk-store');
        loadStoreOptions('hist-store');

        // 점검자 및 날짜 자동 세팅 (로그인한 계정 이름 사용, u-info는 번역 시 '사용자'로 덮어씌워질 수 있음)
        var chkInsp = document.getElementById('chk-inspector');
        var chkDate = document.getElementById('chk-date');
        // 점검자: 로그인 계정 이름만 사용 (u-info는 번역으로 '사용자'가 되어 쓰지 않음)
        if (chkInsp) {
          var inspectorName = (typeof userName !== "undefined" && userName) ? userName : "";
          if (!inspectorName && typeof sessionStorage !== "undefined") inspectorName = sessionStorage.getItem("cm_name") || "";
          chkInsp.value = inspectorName;
        }
        if (chkDate) chkDate.valueAsDate = new Date();
    }

    // [컴플레인 일지] 진입 시 - 번역 적용, 입력 탭, 매장 목록, 작성자, 오늘 날짜, 수정 모드 초기화
    if (page === 'store-complaint') {
        if (typeof applyTranslations === 'function') applyTranslations();
        var complaintEditRow = document.getElementById('complaint-edit-row');
        if (complaintEditRow) complaintEditRow.value = '';
        var complaintNumEl = document.getElementById('complaint-number');
        if (complaintNumEl) {
          complaintNumEl.value = '';
          var ph = (typeof I18N !== 'undefined' && currentLang && I18N[currentLang] && I18N[currentLang].complaint_number_auto) ? I18N[currentLang].complaint_number_auto : '저장 시 자동 부여';
          complaintNumEl.placeholder = ph;
        }
        if (typeof showComplaintTab === 'function') showComplaintTab('input');
        var cStore = document.getElementById('complaint-store');
        var cListStore = document.getElementById('complaint-list-store');
        if (cStore && typeof loadStoreOptions === 'function') { cStore.classList.remove('loaded'); loadStoreOptions('complaint-store'); }
        if (cListStore && typeof loadStoreOptions === 'function') { cListStore.classList.remove('loaded'); loadStoreOptions('complaint-list-store'); }
        var writerEl = document.getElementById('complaint-writer');
        if (writerEl) writerEl.value = (typeof userName !== 'undefined' && userName) ? userName : (typeof sessionStorage !== 'undefined' ? (sessionStorage.getItem('cm_name') || '') : '');
        var today = new Date().toISOString().substring(0, 10);
        var dateEl = document.getElementById('complaint-date');
        if (dateEl && !dateEl.value) dateEl.value = today;
        var listStart = document.getElementById('complaint-list-start');
        var listEnd = document.getElementById('complaint-list-end');
        if (listStart && !listStart.value) listStart.value = today;
        if (listEnd && !listEnd.value) listEnd.value = today;
        if (typeof toggleComplaintDeliveryPlatform === 'function') toggleComplaintDeliveryPlatform();
    }

    // [매장 방문 현황] 진입 시 - 번역 적용 + 매장, 부서(E열), 오피스 직원, 검색 날짜 오늘 기준
    if (page === 'store-visit') {
        if (typeof applyTranslations === 'function') applyTranslations();
        var visitFilterStore = document.getElementById('visit-filter-store');
        if (visitFilterStore) {
            visitFilterStore.classList.remove('loaded');
            if (typeof loadStoreOptions === 'function') loadStoreOptions('visit-filter-store');
        }
        var today = new Date().toISOString().substring(0, 10);
        var visitStart = document.getElementById('visit-start');
        var visitEnd = document.getElementById('visit-end');
        if (visitStart) visitStart.value = today;
        if (visitEnd) visitEnd.value = today;
        var statsStart = document.getElementById('visit-stats-start');
        var statsEnd = document.getElementById('visit-stats-end');
        if (statsStart) statsStart.value = today;
        if (statsEnd) statsEnd.value = today;
        // 오피스 부서(E열) 드롭다운 채우기 - 선택 언어에 맞춰 "전체" 표시
        var deptSel = document.getElementById('visit-filter-dept');
        if (deptSel && typeof google !== 'undefined' && google.script && google.script.run) {
            var allTxt = (typeof I18N !== "undefined" && I18N[currentLang] && I18N[currentLang].label_all) ? I18N[currentLang].label_all : "전체";
            deptSel.innerHTML = '<option value="All">' + allTxt + '</option>';
            google.script.run.withSuccessHandler(function(deptList) {
                if (deptList && deptList.length) {
                    deptList.forEach(function(dept) {
                        deptSel.add(new Option(dept, dept));
                    });
                }
            }).getOfficeDepartments();
            // 직원(오피스) 드롭다운은 전체로 먼저 채우기
            filterVisitEmployeeByDept();
        }
    }

    // [직원 시간표] 진입 시 (별도 메뉴인 경우)
    if (page === 'store-schedule') {
        var schStore = document.getElementById('sch-store');
        if (schStore) schStore.classList.remove('loaded');
        loadStoreOptions('sch-store');
        
        // 주차(Week) 자동 계산 세팅
        var weekInput = document.getElementById("sch-week");
        if (weekInput && !weekInput.value) {
            var today = new Date();
            var year = today.getFullYear();
            var onejan = new Date(year, 0, 1);
            var week = Math.ceil((((today - onejan) / 86400000) + onejan.getDay() + 1) / 7);
            weekInput.value = year + "-W" + (week < 10 ? "0" + week : week);
        }
    }

    // [급여 관리] 진입 시
    if (page === 'payroll') {
        if (typeof showPayrollTab === 'function') showPayrollTab('calc');
        var payMonth = document.getElementById("payroll-month");
        if (payMonth && !payMonth.value) {
            var d = new Date();
            var m = String(d.getMonth() + 1).padStart(2, '0');
            payMonth.value = d.getFullYear() + "-" + m;
        }
        if (typeof loadPayrollStoreOptions === 'function') loadPayrollStoreOptions();
    }

    // 기타 물류/인사 공통 로드
    if (page === 'item-manage') { loadAdminItems(); loadVendorDropdowns(); }
    if (page === 'inbound') { loadVendorDropdowns(); }
    if (page === 'force') { loadOutboundDropdowns(); }
    if (page === 'hr-employee') { /* 직원 목록은 검색 버튼 클릭 시 로드 */ }
    if (page === 'hr-leave' || page === 'hr-stats') { loadLeaveData(); }
}

function filterVisitEmployeeByDept() {
  var deptSel = document.getElementById("visit-filter-dept");
  var empSel = document.getElementById("visit-filter-employee");
  if (!empSel || !deptSel) return;
  var dept = deptSel.value || "All";
  var allTxt = (typeof I18N !== "undefined" && I18N[currentLang] && I18N[currentLang].label_all) ? I18N[currentLang].label_all : "전체";
  empSel.innerHTML = '<option value="All">' + allTxt + '</option>';
  if (typeof google === "undefined" || !google.script || !google.script.run) return;
  google.script.run.withSuccessHandler(function(res) {
    if (res && res.list && res.list.length) {
      res.list.forEach(function(item) {
        var name = item.name || item;
        empSel.add(new Option(name, name));
      });
    }
  }).getOfficeStaffListByDept(dept);
}

function loadVisitHistory() {
  var s = document.getElementById("visit-start").value;
  var e = document.getElementById("visit-end").value;
  var st = document.getElementById("visit-filter-store").value;
  var emp = document.getElementById("visit-filter-employee") ? document.getElementById("visit-filter-employee").value : "All";
  var dept = document.getElementById("visit-filter-dept") ? document.getElementById("visit-filter-dept").value : "All";
  
  load(1);
  google.script.run.withSuccessHandler(list => {
    load(0);
    var b = document.getElementById("visit-history-list");
    b.innerHTML = "";
    if(!list.length) { b.innerHTML = "<tr><td colspan='6'>내역 없음</td></tr>"; return; }
    
    list.forEach(r => {
      b.innerHTML += `<tr><td>${r.date}</td><td>${r.name}</td><td>${r.store}</td><td>${r.type}</td><td>${r.purpose}</td><td>${r.duration || '-'}</td></tr>`;
    });
  }).getStoreVisitHistory(s, e, st, emp, dept);
}

</script>
