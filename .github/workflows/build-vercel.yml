# Vercel 배포 전 빌드 검증 (TypeScript, 컴파일 등)
# - push/PR 시 로컬과 동일한 빌드 실행
# - 실패 시 GitHub에서 확인 가능, Vercel 불필요 배포 감소

name: Build Vercel App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vercel-app/package-lock.json

      - name: Install and build
        run: |
          cd vercel-app
          npm ci
          npm run build
