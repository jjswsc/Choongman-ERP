# Supabase DB 백업 - GitHub Actions
# - 스케줄: UTC 0, 5, 12시 = KST 9, 14, 21시 (하루 3회)
# - 수동 실행: Actions 탭에서 "Run workflow" 클릭
# - SUPABASE_DB_URL 시크릿 필요 (Supabase → Settings → Database → Connection string URI)

name: Supabase DB Backup

on:
  schedule:
    - cron: '0 0,5,12 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create backup directory
        run: mkdir -p backups

      - name: Dump database (roles, schema, data)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set. Add it in GitHub Settings → Secrets."
            exit 1
          fi
          # GitHub Actions는 IPv6 미지원 → Direct(db.xxx.supabase.co) 연결 시 "Network is unreachable" 발생
          # Pooler(Supavisor) 연결 사용 필수: pooler.supabase.com:5432 또는 :6543
          TIMESTAMP=$(date +%Y%m%d-%H%M)
          supabase db dump --db-url "$DB_URL" -f "backups/backup-$TIMESTAMP-roles.sql" --role-only
          supabase db dump --db-url "$DB_URL" -f "backups/backup-$TIMESTAMP-schema.sql"
          supabase db dump --db-url "$DB_URL" -f "backups/backup-$TIMESTAMP-data.sql" --data-only --use-copy
          echo "Backup created: roles, schema, data"

      - name: Compress backup
        run: |
          cd backups && gzip -9 backup-*.sql && ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backups/
          retention-days: 14
