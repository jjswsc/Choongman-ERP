<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choongman ERP - Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        width: min(640px, 92vw);
        background: #1e293b;
        border-radius: 12px;
        padding: 24px;
        box-sizing: border-box;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }
      p {
        margin: 6px 0;
        line-height: 1.5;
        color: #cbd5e1;
      }
      button {
        margin-top: 18px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        padding: 10px 16px;
        font-size: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>ERP 서버 연결을 확인해주세요.</h1>
      <p>현재 네트워크 또는 서버 연결이 불안정합니다.</p>
      <p>연결 복구 후 다시 시도하면 대기 중인 데이터가 자동 동기화됩니다.</p>
      <button onclick="window.location.reload()">다시 시도</button>
    </div>
  </body>
</html>
