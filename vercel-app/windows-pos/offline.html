<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choongman POS - Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #111827;
        color: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        width: min(560px, 92vw);
        background: #1f2937;
        border-radius: 12px;
        padding: 24px;
        box-sizing: border-box;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }
      p {
        margin: 6px 0;
        line-height: 1.5;
        color: #d1d5db;
      }
      button {
        margin-top: 18px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        padding: 10px 16px;
        font-size: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>네트워크 연결을 확인해주세요.</h1>
      <p>서버 접속이 불안정합니다. 인터넷 연결 후 다시 시도하세요.</p>
      <p>
        이 PC에서 POS를 한 번이라도 온라인으로 연 적이 있으면, 「캐시로 열기」로 오프라인 모드(저장된
        로그인·주문 동기화)에 들어갈 수 있습니다.
      </p>
      <p>오프라인 중 저장된 주문은 연결 복구 후 자동 동기화됩니다.</p>
      <p id="retryHint" class="hint" style="display: none; font-size: 13px; color: #9ca3af">
        다시 시도 후에도 같으면 앱을 완전히 종료한 뒤 실행하거나, 인터넷 연결 후 POS를 한 번 열어 캐시를
        갱신해 주세요.
      </p>
      <button id="retryBtn" type="button">다시 시도</button>
      <button id="cacheBtn" type="button" style="margin-left: 8px; background: #059669">캐시로 열기</button>
    </div>
    <script>
      async function retryLoadPos(preferFresh) {
        var btn = document.getElementById("retryBtn");
        var cacheBtn = document.getElementById("cacheBtn");
        var hint = document.getElementById("retryHint");
        if (btn) {
          btn.disabled = true;
          btn.textContent = preferFresh ? "연결 중…" : "캐시 불러오는 중…";
        }
        if (cacheBtn) cacheBtn.disabled = true;
        try {
          if (window.cmPosShell && typeof window.cmPosShell.reloadPosUrl === "function") {
            var r = await window.cmPosShell.reloadPosUrl({ preferFresh: !!preferFresh });
            if (r && r.ok) return;
            if (hint) hint.style.display = "block";
            if (btn) {
              btn.disabled = false;
              btn.textContent = "다시 시도";
            }
            if (cacheBtn) cacheBtn.disabled = false;
            return;
          }
        } catch (e) {}
        if (btn) {
          btn.disabled = false;
          btn.textContent = "다시 시도";
        }
        if (cacheBtn) cacheBtn.disabled = false;
        window.location.reload();
      }
      var rb = document.getElementById("retryBtn");
      if (rb) rb.addEventListener("click", function () { void retryLoadPos(true); });
      var cb = document.getElementById("cacheBtn");
      if (cb) cb.addEventListener("click", function () { void retryLoadPos(false); });
    </script>
  </body>
</html>
