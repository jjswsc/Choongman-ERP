<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choongman POS - Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #111827;
        color: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        width: min(560px, 92vw);
        background: #1f2937;
        border-radius: 12px;
        padding: 24px;
        box-sizing: border-box;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }
      p {
        margin: 6px 0;
        line-height: 1.5;
        color: #d1d5db;
      }
      button {
        margin-top: 18px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        padding: 10px 16px;
        font-size: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>네트워크 연결을 확인해주세요.</h1>
      <p>서버 접속이 불안정합니다. 인터넷 연결 후 다시 시도하세요.</p>
      <p>오프라인 중 저장된 주문은 연결 복구 후 자동 동기화됩니다.</p>
      <button onclick="window.location.reload()">다시 시도</button>
    </div>
  </body>
</html>
